<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gzowo Labs</title>
<meta name="description" content="A project by Gzowo Labs.">
<meta name="theme-color" content="#FAFAF8">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body class="body--project">

<canvas id="bg" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>

<main class="stage" id="stage">

  <nav class="back"><a href="./" class="back__link">Gzowo Labs</a></nav>

  <article class="project" id="project" hidden>
    <header class="project__head">
      <h1 class="mark mark--project" id="mark">
        <span class="sr-only" id="titleSr"></span>
        <span class="mark__layer mark__base" aria-hidden="true"></span>
        <span class="mark__layer mark__flood" aria-hidden="true"></span>
      </h1>

      <ul class="facts" id="facts"></ul>

      <div class="actions" id="actions"></div>
    </header>

    <div class="project__body">
      <div class="prose" id="prose"></div>
      <aside class="stack" id="stackBox"></aside>
    </div>

    <div class="shots" id="shots"></div>

    <nav class="siblings" id="siblings" aria-label="Other projects"></nav>
  </article>

  <p class="empty" id="missing" hidden>That project is not here. <a href="./">Back to Gzowo Labs</a>.</p>

</main>

<script src="assets/config.js"></script>
<script src="assets/clicks.js"></script>
<script src="assets/bg.js"></script>
<script src="assets/wordmark.js"></script>
<script src="assets/project.js"></script>
</body>
</html>
